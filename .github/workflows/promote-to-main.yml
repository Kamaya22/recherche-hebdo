name: Promote an agent branch to main

# The cloud routine can only push to its own `claude/...` branch. This workflow checks what
# that branch changed and, if it carries a reading and stays inside the content directories,
# moves it onto main, deletes the branch, and starts the email / stats workflows.
#
# Runs on `workflow_run`, so this file is always taken from main — see agent-branch.yml.
# A branch that touches anything else (workflows, tools, INSTRUCTIONS.md…) is refused:
# the job fails (GitHub notifies you) and the branch is kept for inspection until
# prune-claude-branches.yml removes it.

on:
  workflow_run:
    workflows: ["Agent branch pushed"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    if: startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote the branch onto main
        id: promote
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # Delete the branch, but only if nobody pushed to it since (lease on $SHA).
          delete_branch() {
            git push -q origin --force-with-lease="refs/heads/$BRANCH:$SHA" --delete "$BRANCH" \
              && echo "Deleted $BRANCH." \
              || echo "::warning::$BRANCH moved or is already gone — left for prune-claude-branches.yml."
          }
          done_nothing() {
            echo "$1"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            delete_branch
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$SHA"

          # Already published — never re-dispatch, that would resend an old email.
          if git merge-base --is-ancestor "$SHA" HEAD; then
            done_nothing "main already contains $SHA, nothing to promote."
          fi

          BASE=$(git merge-base HEAD "$SHA")
          CHANGED=$(git diff --name-only "$BASE" "$SHA")
          echo "Changed files on this branch:"
          echo "$CHANGED" | sed 's/^/  /'

          # Refuse anything that reaches outside the content directories.
          OUTSIDE=$(echo "$CHANGED" | grep -vE '^(weeks|themes|rapports|data)/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::$BRANCH touches files outside weeks|themes|rapports|data — refusing to promote:"
            echo "$OUTSIDE" | sed 's/^/  /'
            exit 1
          fi

          # Only publishable work gets promoted.
          if ! echo "$CHANGED" | grep -qE '^(weeks/.+/day-[0-9]+\.md|rapports/.+\.md)$'; then
            echo "::error::$BRANCH carries no reading or report — nothing publishable, leaving main alone."
            exit 1
          fi

          # Keep main linear: send-reading.yml checks out with fetch-depth 2 and reads
          # `git log -1 -- weeks/**/day-*.md`, which a merge commit would hide.
          if git merge --ff-only "$SHA" 2>/dev/null; then
            echo "Fast-forwarded main."
          else
            # main has moved on since the branch was cut. Replaying the commits conflicts
            # (two runs each create weeks/<week>/theme.md), so copy the publishable content
            # instead: the reading and report files. main stays authoritative for the
            # themes/ bookkeeping, whose branch version is stale by definition.
            echo "Not a fast-forward. Copying the publishable files from $SHA onto main."
            # `|| true`: a grep with no match returns 1, which pipefail would turn into a
            # job failure. A branch legitimately may carry no theme.md.
            CONTENT=$(echo "$CHANGED" | grep -E '^(weeks/.+/day-[0-9]+\.md|rapports/.+\.md|data/citations/.+)$' || true)
            THEMES=$(echo "$CHANGED" | grep -E '^weeks/.+/theme\.md$' || true)

            for f in $CONTENT; do
              echo "  taking $f"
              git checkout "$SHA" -- "$f"
            done
            # theme.md only when main does not have one for that week yet.
            for f in $THEMES; do
              if [ -e "$f" ]; then
                echo "  keeping main's $f"
              else
                echo "  taking $f"
                git checkout "$SHA" -- "$f"
              fi
            done

            if [ -z "$(git status --porcelain)" ]; then
              done_nothing "Those files are already on main with identical content — nothing to publish."
            fi

            git commit -m "$(git log -1 --format=%s "$SHA")" \
                       -m "Promoted onto main from ${BRANCH} by promote-to-main.yml."
          fi

          git push origin main
          delete_branch

          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo "report=$(echo "$CHANGED" | grep -qE '^rapports/.+\.md$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "stats=$(echo "$CHANGED" | grep -qE '^data/(citations/|registry\.csv$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows; workflow_dispatch is the
      # documented exception, so the email workflows are kicked off explicitly here. Both already
      # have a dispatch path that picks the most recently committed reading/report.
      - name: Send the reading
        if: steps.promote.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run send-reading.yml --ref main

      - name: Send the weekly report
        if: steps.promote.outputs.promoted == 'true' && steps.promote.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run send-report.yml --ref main

      - name: Rebuild source statistics
        if: steps.promote.outputs.promoted == 'true' && steps.promote.outputs.stats == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-stats.yml --ref main
